services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SSK_DB_NAME}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ./db-data/mysql:/var/lib/mysql
      - ./mysql-initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - ssk-net

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: always
    environment:
      TZ: ${TZ}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - ./db-data/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - ssk-net

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      TZ: ${TZ}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./db-data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - ssk-net

  zlmediakit:
    image: ${ZLM_IMAGE}
    container_name: zlmediakit
    restart: always
    environment:
      TZ: ${TZ}
    command: sh -c "./MediaServer -s default.pem -c /opt/media/conf/config.ini"
    ports:
      - "${ZLM_RTMP_PORT}:1935"
      - "${ZLM_HTTP_PORT}:80"
      - "${ZLM_HTTPS_PORT}:443"
      - "${ZLM_RTSP_PORT}:554"
      - "${ZLM_RTP_PROXY_TCP_PORT}:10000"
      - "${ZLM_RTP_PROXY_UDP_PORT}:10000/udp"
      - "${ZLM_RTP_SERVER_PORT}:8000"
      - "${ZLM_RTP_SERVER_PORT}:8000/udp"
      - "${ZLM_WEBRTC_UDP_PORT}:9000/udp"
    volumes:
      - ./zlm/conf:/opt/media/conf
      - ./zlm/www:/opt/media/bin/www
    networks:
      - ssk-net

  caps:
    image: eclipse-temurin:8-jre
    container_name: caps
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      zlmediakit:
        condition: service_started
    command: ["java", "-jar", "/app/ruoyi.jar"]
    environment:
      TZ: ${TZ}
      SPRING_PROFILES_ACTIVE: druid
      LOGGING_LEVEL_COM_RUOYI: info
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: info
      SPRING_DATASOURCE_DRUID_MASTER_URL: jdbc:mysql://mysql:3306/${CAPS_DB_NAME}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia%2FShanghai
      SPRING_DATASOURCE_DRUID_MASTER_USERNAME: ${CAPS_DB_USER}
      SPRING_DATASOURCE_DRUID_MASTER_PASSWORD: ${CAPS_DB_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      RTMP_URL: ${RTMP_URL}
      WEBRTC_URL: ${WEBRTC_URL}
      CAPS_STREAM_STARTING_GRACE_MS: ${CAPS_STREAM_STARTING_GRACE_MS:-40000}
      CAPS_STREAM_LOST_GRACE_MS: ${CAPS_STREAM_LOST_GRACE_MS:-40000}
      CAPS_STREAM_OPEN_RTSP_MIN_INTERVAL_MS: ${CAPS_STREAM_OPEN_RTSP_MIN_INTERVAL_MS:-60000}
      CAPS_STREAM_FAILED_RESTART_DELAY_MS: ${CAPS_STREAM_FAILED_RESTART_DELAY_MS:-5000}
      CAPS_STREAM_AUTO_RESTART_RESET_MS: ${CAPS_STREAM_AUTO_RESTART_RESET_MS:-300000}
      CAPS_STREAM_AUTO_RESTART_LIMIT: ${CAPS_STREAM_AUTO_RESTART_LIMIT:-1}
    volumes:
      - ./caps/ruoyi.jar:/app/ruoyi.jar:ro
      - ./caps/app/logs:/app/logs
    ports:
      - "${CAPS_PORT}:5010"
    networks:
      - ssk-net

  netcore:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    container_name: netcore
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    command: ["dotnet", "Venus.WebApi.dll"]
    environment:
      TZ: ${TZ}
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      Connection__DBType: MySql
      Connection__DbConnectionString: Server=mysql;Port=3306;Database=${SSK_DB_NAME};Uid=${SSK_DB_USER};Pwd=${SSK_DB_PASSWORD};
      Connection__MongoDbConnectionString: mongodb://mongodb:27017/
      Connection__RedisConnectionString: redis:6379,Password=${REDIS_PASSWORD},SyncTimeout=15000
      Connection__UseRedis: ${SSK_USE_REDIS}
      CompreFace__BaseUrl: ${COMPREFACE_BASE_URL}
      CompreFace__RecognitionPath: ${COMPREFACE_RECOGNITION_PATH}
      CompreFace__ApiKey: ${SSK_COMPREFACE_API_KEY}
      CompreFace__GroupApiKeys__zny: ${SSK_COMPREFACE_API_KEY}
      WATCH_TCP_PORT: 5011
      WatchTcp__Port: 5011
    volumes:
      - ./publish:/app
    ports:
      - "${SSK_PORT}:80"
      - "${WATCH_TCP_PORT}:5011"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ssk-net

  manage-frontend:
    image: nginx:1.27-alpine
    container_name: manage-frontend
    restart: always
    depends_on:
      netcore:
        condition: service_started
      caps:
        condition: service_started
      zlmediakit:
        condition: service_started
    volumes:
      - ./publish/wwwroot:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${MANAGE_FRONTEND_PORT}:80"
      - "${MANAGE_FRONTEND_HTTPS_PORT}:443"
    networks:
      - ssk-net

networks:
  ssk-net:
    name: ${MAIN_NETWORK_NAME}
    driver: bridge
