services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${SSK_DB_NAME:-aqjc_manage_system}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./db-data/mysql:/var/lib/mysql
      - ./mysql-initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - ssk-net

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: always
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ./db-data/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - ssk-net

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./db-data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - ssk-net

  zlmediakit:
    image: ${ZLM_IMAGE:-zl:transcode}
    container_name: zlmediakit
    restart: always
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command: sh -c "./MediaServer -s default.pem -c /opt/media/conf/config.ini"
    ports:
      - "${ZLM_RTMP_PORT:-1935}:1935"
      - "${ZLM_HTTP_PORT:-8081}:80"
      - "${ZLM_HTTPS_PORT:-8949}:443"
      - "${ZLM_RTSP_PORT:-8554}:554"
      - "${ZLM_RTP_PROXY_TCP_PORT:-10000}:10000"
      - "${ZLM_RTP_PROXY_UDP_PORT:-10000}:10000/udp"
      - "${ZLM_RTP_SERVER_PORT:-8000}:8000/udp"
      - "${ZLM_WEBRTC_UDP_PORT:-9000}:9000/udp"
    volumes:
      - ./zlm/conf:/opt/media/conf
      - ./zlm/www:/opt/media/bin/www
    networks:
      - ssk-net

  caps:
    image: eclipse-temurin:8-jre
    container_name: caps
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      zlmediakit:
        condition: service_started
    command: ["java", "-jar", "/app/ruoyi.jar"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: druid
      SPRING_DATASOURCE_DRUID_MASTER_URL: jdbc:mysql://mysql:3306/${CAPS_DB_NAME:-ry-zhdj}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia%2FShanghai
      SPRING_DATASOURCE_DRUID_MASTER_USERNAME: ${CAPS_DB_USER:-root}
      SPRING_DATASOURCE_DRUID_MASTER_PASSWORD: ${CAPS_DB_PASSWORD:-123456}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      RTMP_URL: ${RTMP_URL:-zlmediakit}
    volumes:
      - ./caps/ruoyi.jar:/app/ruoyi.jar:ro
    ports:
      - "${CAPS_PORT:-5010}:5010"
    networks:
      - ssk-net

  netcore:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    container_name: netcore
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    command: ["dotnet", "Venus.WebApi.dll"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      Connection__DBType: MySql
      Connection__DbConnectionString: Server=mysql;Port=3306;Database=${SSK_DB_NAME:-aqjc_manage_system};Uid=${SSK_DB_USER:-root};Pwd=${SSK_DB_PASSWORD:-123456};
      Connection__MongoDbConnectionString: mongodb://mongodb:27017/
      Connection__RedisConnectionString: redis:6379,Password=${REDIS_PASSWORD:-123456},SyncTimeout=15000
      Connection__UseRedis: ${SSK_USE_REDIS:-false}
      CompreFace__BaseUrl: ${COMPREFACE_BASE_URL:-http://host.docker.internal:8001}
      CompreFace__RecognitionPath: ${COMPREFACE_RECOGNITION_PATH:-/api/v1/recognition}
      CompreFace__ApiKey: ${SSK_COMPREFACE_API_KEY:-2f8191f6-02a5-4dd5-821b-4a50aea1572d}
      CompreFace__GroupApiKeys__zny: ${SSK_COMPREFACE_API_KEY:-2f8191f6-02a5-4dd5-821b-4a50aea1572d}
    volumes:
      - ./publish:/app
    ports:
      - "${SSK_PORT:-9991}:80"
    networks:
      - ssk-net

  manage-frontend:
    image: nginx:1.27-alpine
    container_name: manage-frontend
    restart: always
    depends_on:
      netcore:
        condition: service_started
      caps:
        condition: service_started
      zlmediakit:
        condition: service_started
    volumes:
      - ./publish/wwwroot:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${MANAGE_FRONTEND_PORT:-3000}:80"
    networks:
      - ssk-net

networks:
  ssk-net:
    name: ${MAIN_NETWORK_NAME:-ssk-main-net}
    driver: bridge
